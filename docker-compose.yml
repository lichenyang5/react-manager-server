services:
  mongo:
    image: mongo:7
    container_name: react-manager-mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  nest-api:
    build:
      context: ./nest-server
      dockerfile: Dockerfile
    container_name: react-manager-nest-api
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      MONGODB_URI: mongodb://mongo:27017/MyManager
    depends_on:
      - mongo
    restart: unless-stopped

  web:
    build:
      context: ../react-manager
      dockerfile: Dockerfile
    container_name: react-manager-web
    ports:
      - "8080:80"
    depends_on:
      - nest-api
    restart: unless-stopped

volumes:
  mongo-data:
